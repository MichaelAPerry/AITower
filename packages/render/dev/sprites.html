<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AItower sprite sheet</title>
		<style>
			html, body { margin: 0; background: #07072a; color: #f0f0ff; font: 13px monospace; }
			#sheet { padding: 12px; display: flex; flex-direction: column; gap: 10px; width: max-content; }
			h2 { margin: 6px 0 0; font: 14px monospace; color: #9be564; }
			.row { display: flex; flex-direction: column; gap: 4px; }
			.host { position: relative; overflow: hidden; outline: 1px solid #3d4290; }
			.cap { color: #5ce1ff; }
			h1.sheet-title { margin: 0 0 4px; font: 18px monospace; color: #f0f0ff; max-width: 1500px; }
			.host { position: relative; }
			.lab { position: absolute; text-align: center; color: #f0f0ff; font: 11px monospace; line-height: 1.15; pointer-events: none; text-shadow: 0 0 3px #07072a, 1px 1px 0 #07072a; }
			.lab1 { top: 2px; text-align: left; white-space: nowrap; overflow: hidden; }
			.lab3 { bottom: 6px; }
			.lab3 b { display: block; font-size: 15px; color: #9be564; }
			.lab3 span { display: block; color: #cfd0ff; }
			.frames { display: flex; flex-wrap: wrap; gap: 16px 18px; max-width: 1480px; }
		</style>
	</head>
	<body>
		<div id="sheet"></div>
		<script type="module" src="./sprites.ts"></script>
	</body>
</html>
