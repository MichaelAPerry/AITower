<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AItower sprite sheet</title>
		<style>
			html, body { margin: 0; background: #07072a; color: #f0f0ff; font: 13px monospace; }
			#sheet { padding: 12px; display: flex; flex-direction: column; gap: 10px; width: max-content; }
			h2 { margin: 6px 0 0; font: 14px monospace; color: #9be564; }
			.row { display: flex; flex-direction: column; gap: 4px; }
			.host { position: relative; overflow: hidden; outline: 1px solid #3d4290; }
			.cap { color: #5ce1ff; }
		</style>
	</head>
	<body>
		<div id="sheet"></div>
		<script type="module" src="./sprites.ts"></script>
	</body>
</html>
