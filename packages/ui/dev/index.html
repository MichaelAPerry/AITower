<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AItower HUD harness</title>
		<style>
			html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b08; }
			#world { position: fixed; inset: 0; background:
				linear-gradient(rgba(0,0,0,0.12) 1px, transparent 1px) 0 0 / 16px 16px,
				linear-gradient(180deg, #4a5a55 0%, #3d4a3f 55%, #2a261d 56%, #17140f 100%); }
			#world .placeholder { position: absolute; left: 30%; top: 30%; width: 40%; height: 34%; border: 1px dashed #a8987a; color: #c9bc9c; font: 12px ui-monospace, monospace; display: grid; place-items: center; }
			#hud { position: fixed; inset: 0; pointer-events: none; }
		</style>
	</head>
	<body>
		<div id="world"><div class="placeholder">world canvas (renderer) goes here</div></div>
		<div id="hud"></div>
		<script type="module" src="./main.tsx"></script>
	</body>
</html>
